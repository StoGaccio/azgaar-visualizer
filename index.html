<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappa Grania</title>
<link rel="icon" type="image/png" href="https://github.com/StoGaccio/StoGaccio/blob/main/bozzettino.png?raw=true">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html {
    width: 100%;
    height: 100%;
    background: #1a1a1a;
    font-family: Calibri, Corpo;
    overflow: hidden;
  }
  #header {
    background: #15142a;
    color: #09ad1f;
    padding: 10px 20px;
    text-align: center;
    font-size: 1.2em;
    letter-spacing: 1px;
    border-bottom: 2px solid #09911b;
  }
  #map-container {
    width: 100%;
    height: calc(100vh - 48px);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<div id="header">Grania</div>

<div id="map-container">
  <iframe
    src="https://azgaar.github.io/Fantasy-Map-Generator/?maplink=https://raw.githubusercontent.com/StoGaccio/azgaar-visualizer/main/Grania 2026-09-07-11-11.map&options=default"
    allowfullscreen>
  </iframe>
</div>

</body>
</html>
